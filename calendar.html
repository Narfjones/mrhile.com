<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Google Docs Calendar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font for a modern look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light blue-gray background */
            display: flex;
            flex-direction: column; /* Allow header and calendar to stack */
            justify-content: flex-start; /* Align items to the top */
            align-items: center;
            min-height: 100vh;
            padding: 0; /* Remove body padding to allow sticky header to go to edge */
            box-sizing: border-box;
        }

        /* Styles for the main content area to add padding */
        .content-area {
            width: 100%;
            max-width: 900px;
            padding: 1rem; /* Add padding here instead of body */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-header {
            width: 100%;
            background-color: #4f46e5; /* Indigo background */
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem; /* Space between title and calendar */
            text-align: center;
            /* Added margin-top to account for the sticky nav */
            margin-top: 5rem; /* Adjust this value if the nav height changes */
        }
        .main-header h1 {
            font-size: 2.5rem; /* Large title */
            font-weight: 700;
            margin: 0;
        }

        /* Styles for the calendar container */
        .calendar-container {
            background-color: #ffffff;
            border-radius: 1.5rem; /* More rounded corners */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0; /* Light border */
        }
        .calendar-header button {
            background-color: #4f46e5; /* Indigo */
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem; /* Rounded buttons */
            font-weight: 500;
            transition: background-color 0.2s ease-in-out;
            cursor: pointer;
            border: none;
            outline: none;
        }
        .calendar-header button:hover {
            background-color: #4338ca; /* Darker indigo on hover */
        }
        .calendar-header h2 {
            font-size: 1.75rem; /* Larger month/year */
            font-weight: 600;
            color: #1a202c; /* Dark text */
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #4a5568; /* Gray text */
            margin-bottom: 1rem;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem; /* Smaller gap for tighter grid */
        }
        .day-cell {
            padding: 0.75rem 0.5rem; /* Adjusted padding */
            border-radius: 0.75rem; /* Rounded day cells */
            text-align: center;
            font-weight: 500;
            color: #2d3748; /* Darker gray for numbers */
            background-color: #edf2f7; /* Light gray background */
            cursor: pointer;
            transition: background-color 0.2s ease-in-out, transform 0.1s ease-in-out;
            position: relative; /* For the link indicator */
            min-height: 5rem; /* Ensure cells are tall enough for content */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            font-size: 0.875rem; /* Smaller font for day numbers */
        }
        .day-cell:hover {
            background-color: #e2e8f0; /* Lighter gray on hover */
            transform: translateY(-2px); /* Slight lift effect */
        }
        .day-cell.empty {
            background-color: transparent;
            cursor: default;
            pointer-events: none; /* Disable interaction */
        }
        .day-cell.current-day {
            background-color: #6366f1; /* Stronger indigo for current day */
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .day-cell.has-link {
            background-color: #d1fae5; /* Light green for days with links */
            border: 2px solid #34d399; /* Green border */
            color: #065f46; /* Dark green text */
        }
        .day-cell.has-link:hover {
            background-color: #a7f3d0; /* Darker green on hover */
        }
        .link-indicator {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            width: 0.75rem;
            height: 0.75rem;
            background-color: #10b981; /* Emerald green dot */
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
        }

        /* Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transform: translateY(-20px);
            transition: transform 0.3s ease-in-out;
        }
        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }
        .modal-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a202c;
            text-align: center;
            margin-bottom: 1rem;
        }
        .modal-content label {
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 0.5rem;
            display: block;
        }
        .modal-content input[type="url"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e0;
            border-radius: 0.75rem;
            font-size: 1rem;
            color: #2d3748;
            outline: none;
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .modal-content input[type="url"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end; /* Align buttons to the right */
            flex-wrap: wrap; /* Allow buttons to wrap on smaller screens */
        }
        .modal-buttons button {
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            outline: none;
            transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
        }
        .modal-buttons .save-button {
            background-color: #4f46e5; /* Indigo */
            color: white;
        }
        .modal-buttons .save-button:hover {
            background-color: #4338ca;
        }
        .modal-buttons .view-button {
            background-color: #10b981; /* Emerald green */
            color: white;
        }
        .modal-buttons .view-button:hover {
            background-color: #059669;
        }
        .modal-buttons .delete-button {
            background-color: #ef4444; /* Red */
            color: white;
        }
        .modal-buttons .delete-button:hover {
            background-color: #dc2626;
        }
        .modal-buttons .close-button {
            background-color: #e2e8f0; /* Light gray */
            color: #4a5568;
        }
        .modal-buttons .close-button:hover {
            background-color: #cbd5e0;
        }
        .modal-message {
            margin-top: 1rem;
            text-align: center;
            color: #ef4444; /* Red for error messages */
            font-size: 0.875rem;
            display: none; /* Hidden by default */
        }
        .modal-message.show {
            display: block;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .main-header {
                padding: 1rem;
                margin-top: 4.5rem; /* Adjust for smaller nav height on mobile */
                margin-bottom: 1.5rem;
            }
            .main-header h1 {
                font-size: 1.75rem;
            }
            .content-area {
                padding: 0.5rem;
            }
            .calendar-container {
                padding: 1rem;
                gap: 1rem;
            }
            .calendar-header h2 {
                font-size: 1.5rem;
            }
            .calendar-header button {
                padding: 0.4rem 0.8rem;
                font-size: 0.875rem;
            }
            .day-cell {
                padding: 0.5rem 0.25rem;
                min-height: 4rem;
                font-size: 0.75rem;
            }
            .weekdays {
                font-size: 0.875rem;
            }
            .modal-content {
                padding: 1.5rem;
                gap: 1rem;
            }
            .modal-content h3 {
                font-size: 1.25rem;
            }
            .modal-buttons {
                flex-direction: column; /* Stack buttons on small screens */
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <!-- New sticky navigation menu -->
    <nav class="bg-white/80 backdrop-blur-sm shadow-md py-4 px-6 sticky top-0 z-50 w-full">
        <div class="container mx-auto flex justify-center space-x-8 md:space-x-12">
            <a href="index.html" class="text-[#3D405B] hover:text-[#81B29A] font-semibold text-lg transition-colors duration-200">Home</a>
            <a href="physics.html" class="text-[#3D405B] hover:text-[#81B29A] font-semibold text-lg transition-colors duration-200">Physics</a>
            <a href="cs.html" class="text-[#3D405B] hover:text-[#81B29A] font-semibold text-lg transition-colors duration-200">Computer Science</a>
            <a href="digitalelectronics.html" class="text-[#3D405B] hover:text-[#81B29A] font-semibold text-lg transition-colors duration-200">Digital Electronics</a>
            <a href="calendar.html" class="text-[#3D405B] hover:text-[#81B29A] font-semibold text-lg transition-colors duration-200">Calendar</a>
        </div>
    </nav>

    <div class="content-area">
        <header class="main-header">
            <h1>Classroom Calendar</h1>
        </header>
        <div id="app" class="calendar-container">
            <div class="calendar-header">
                <button id="prevMonth">&lt; Prev</button>
                <h2 id="currentMonthYear"></h2>
                <button id="nextMonth">Next &gt;</button>
            </div>

            <div class="weekdays">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>

            <div id="calendar-grid" class="calendar-grid">
                <!-- Calendar days will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- Link Modal -->
    <div id="link-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-date"></h3>
            <label for="google-docs-url">Google Docs Link:</label>
            <input type="url" id="google-docs-url" placeholder="Enter Google Docs URL (e.g., https://docs.google.com/document/d/...)">
            <div id="modal-message" class="modal-message"></div>
            <div class="modal-buttons">
                <button id="save-link-button" class="save-button">Save Link</button>
                <button id="view-link-button" class="view-button" disabled>View Doc</button>
                <button id="delete-link-button" class="delete-button" disabled>Delete Link</button>
                <button id="close-modal-button" class="close-button">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Get references to DOM elements
        const currentMonthYearEl = document.getElementById('currentMonthYear');
        const calendarGridEl = document.getElementById('calendar-grid');
        const prevMonthBtn = document.getElementById('prevMonth');
        const nextMonthBtn = document.getElementById('nextMonth');

        const modalOverlay = document.getElementById('link-modal-overlay');
        const modalDateEl = document.getElementById('modal-date');
        const googleDocsUrlInput = document.getElementById('google-docs-url');
        const saveLinkBtn = document.getElementById('save-link-button');
        const viewLinkBtn = document.getElementById('view-link-button');
        const deleteLinkBtn = document.getElementById('delete-link-button');
        const closeModalBtn = document.getElementById('close-modal-button');
        const modalMessageEl = document.getElementById('modal-message');

        // Initialize current date to August 2025 (month 7 is August, 0-indexed)
        let currentDate = new Date(2025, 7, 1);
        // Variable to store the date being edited in the modal
        let selectedDateForModal = null;

        /**
         * Renders the calendar grid for the current month.
         */
        function renderCalendar() {
            // Clear previous grid
            calendarGridEl.innerHTML = '';

            // Get current month and year
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth(); // 0-indexed

            // Set the month and year display in the header
            currentMonthYearEl.textContent = currentDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });

            // Get the first day of the month (0 = Sunday, 6 = Saturday)
            const firstDayOfMonth = new Date(year, month, 1).getDay();
            // Get the number of days in the current month
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Get today's date for highlighting
            const today = new Date();
            const isCurrentMonth = (year === today.getFullYear() && month === today.getMonth());
            const currentDayNumber = today.getDate();

            // Create empty cells for the days before the 1st of the month
            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day-cell', 'empty');
                calendarGridEl.appendChild(emptyCell);
            }

            // Create cells for each day of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell');
                dayCell.textContent = day;

                // Format the date for localStorage key
                const formattedDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                dayCell.dataset.date = formattedDate; // Store full date in data attribute

                // Check if this is the current day and add a class
                if (isCurrentMonth && day === currentDayNumber) {
                    dayCell.classList.add('current-day');
                }

                // Check if a link exists for this date in localStorage
                if (localStorage.getItem(`calendar_doc_${formattedDate}`)) {
                    dayCell.classList.add('has-link');
                    // Add a small visual indicator (dot)
                    const indicator = document.createElement('div');
                    indicator.classList.add('link-indicator');
                    dayCell.appendChild(indicator);
                }

                // Add left-click listener to open the link directly
                dayCell.addEventListener('click', () => {
                    const url = localStorage.getItem(`calendar_doc_${formattedDate}`);
                    if (url) {
                        window.open(url, '_blank');
                    }
                    // If no link exists, left-click does nothing
                });

                // Add right-click listener to open the modal
                dayCell.addEventListener('contextmenu', (event) => {
                    event.preventDefault(); // Prevent default browser context menu
                    showLinkModal(formattedDate);
                });

                calendarGridEl.appendChild(dayCell);
            }
        }

        /**
         * Displays the modal for adding/viewing/deleting Google Docs links.
         * @param {string} dateString - The date in 'YYYY-MM-DD' format.
         */
        function showLinkModal(dateString) {
            selectedDateForModal = dateString; // Store the date for modal actions
            modalDateEl.textContent = new Date(dateString).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            const savedUrl = localStorage.getItem(`calendar_doc_${dateString}`);
            googleDocsUrlInput.value = savedUrl || '';

            // Enable/disable buttons based on whether a link exists
            viewLinkBtn.disabled = !savedUrl;
            deleteLinkBtn.disabled = !savedUrl;

            modalMessageEl.classList.remove('show'); // Hide previous messages
            modalOverlay.classList.add('show');
        }

        /**
         * Hides the link modal.
         */
        function hideLinkModal() {
            modalOverlay.classList.remove('show');
            googleDocsUrlInput.value = ''; // Clear input
            selectedDateForModal = null; // Reset selected date
            modalMessageEl.classList.remove('show'); // Hide message
        }

        /**
         * Saves the Google Docs link to localStorage for the selected date.
         */
        function saveLink() {
            const url = googleDocsUrlInput.value.trim();
            if (!selectedDateForModal) {
                modalMessageEl.textContent = 'Error: No date selected.';
                modalMessageEl.classList.add('show');
                return;
            }

            if (url === '') {
                // If input is empty, delete the link
                deleteLink();
                return;
            }

            // Basic URL validation (can be more robust)
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                modalMessageEl.textContent = 'Please enter a valid URL starting with http:// or https://';
                modalMessageEl.classList.add('show');
                return;
            }

            localStorage.setItem(`calendar_doc_${selectedDateForModal}`, url);
            modalMessageEl.textContent = 'Link saved successfully!';
            modalMessageEl.style.color = '#059669'; // Green for success
            modalMessageEl.classList.add('show');
            renderCalendar(); // Re-render calendar to update day cell appearance
            viewLinkBtn.disabled = false; // Enable view button
            deleteLinkBtn.disabled = false; // Enable delete button
        }

        /**
         * Opens the saved Google Docs link in a new tab.
         */
        function viewLink() {
            const url = localStorage.getItem(`calendar_doc_${selectedDateForModal}`);
            if (url) {
                window.open(url, '_blank');
            } else {
                modalMessageEl.textContent = 'No link found for this date.';
                modalMessageEl.style.color = '#ef4444'; // Red for error
                modalMessageEl.classList.add('show');
            }
        }

        /**
         * Deletes the Google Docs link from localStorage for the selected date.
         */
        function deleteLink() {
            if (selectedDateForModal && localStorage.getItem(`calendar_doc_${selectedDateForModal}`)) {
                localStorage.removeItem(`calendar_doc_${selectedDateForModal}`);
                googleDocsUrlInput.value = ''; // Clear input field
                modalMessageEl.textContent = 'Link deleted successfully!';
                modalMessageEl.style.color = '#059669'; // Green for success
                modalMessageEl.classList.add('show');
                renderCalendar(); // Re-render calendar to update day cell appearance
                viewLinkBtn.disabled = true; // Disable view button
                deleteLinkBtn.disabled = true; // Disable delete button
            } else {
                modalMessageEl.textContent = 'No link to delete for this date.';
                modalMessageEl.style.color = '#ef4444'; // Red for error
                modalMessageEl.classList.add('show');
            }
        }

        // Event Listeners for navigation buttons
        prevMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // Event Listeners for modal buttons
        saveLinkBtn.addEventListener('click', saveLink);
        viewLinkBtn.addEventListener('click', viewLink);
        deleteLinkBtn.addEventListener('click', deleteLink);
        closeModalBtn.addEventListener('click', hideLinkModal);
        // Close modal if clicking outside the content
        modalOverlay.addEventListener('click', (event) => {
                if(even.button == 0){
                viewLink;
            }
                if (event.target === modalOverlay) {
                    hideLinkModal();
                }
        });

        // Initial render of the calendar when the page loads
        document.addEventListener('DOMContentLoaded', renderCalendar);
    </script>
</body>
</html>
